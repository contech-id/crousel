openapi: 3.0.3
info:
  title: Crousel Ecommerce API
  description: API autentikasi customer/admin, pengaturan toko, katalog, dan notifikasi untuk aplikasi ecommerce.
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
tags:
  - name: Authentication
    description: Registrasi, login, dan logout pengguna
  - name: Profile
    description: Data profil pengguna yang sedang login
  - name: Products
    description: Katalog produk ecommerce
  - name: Product Categories
    description: Kategori produk dan contoh nama produk
  - name: Customers
    description: Data customer yang terdaftar
  - name: Settings
    description: Pengaturan toko, pengiriman, pembayaran, dan notifikasi
  - name: Notifications
    description: Histori notifikasi admin
  - name: Orders
    description: Pembuatan pesanan dan daftar pesanan admin
  - name: Cart
    description: Keranjang belanja pengguna yang sedang login
  - name: Social Media
    description: Link sosial media dan kanal bantuan toko
  - name: Admin Authentication
    description: Autentikasi dan pengelolaan akun administrator
paths:
  /admin/auth/login:
    post:
      tags: [Admin Authentication]
      summary: Login administrator
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminLoginRequest' }
      responses:
        '200': { description: Login berhasil }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/register:
    post:
      tags: [Authentication]
      summary: Registrasi akun baru
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Budi Santoso
              whatsapp: '081234567890'
              password: rahasia123
      responses:
        '201':
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                message: Registrasi berhasil.
                data:
                  user:
                    id: 1
                    name: Budi Santoso
                    whatsapp: '6281234567890'
                    birth_date: null
                    gender: null
                    province: null
                    regency: null
                    district: null
                    village: null
                    postal_code: null
                    address: null
                    created_at: '2026-09-05T13:00:00.000000Z'
                    updated_at: '2026-09-05T13:00:00.000000Z'
                  token: 1|example-token
                  token_type: Bearer
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/login:
    post:
      tags: [Authentication]
      summary: Login dengan nomor WhatsApp
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              whatsapp: '081234567890'
              password: rahasia123
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout dan cabut token aktif
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Logout berhasil.
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /profile:
    get:
      tags: [Profile]
      summary: Ambil profil pengguna yang sedang login
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags: [Profile]
      summary: Perbarui profil pengguna
      description: Semua field bersifat opsional; hanya field yang dikirim yang diperbarui. Kirim null untuk mengosongkan field profil.
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              name: Budi Santoso
              whatsapp: '081234567890'
              birth_date: '1995-08-17'
              gender: male
              province: Jawa Barat
              regency: Kota Bandung
              district: Coblong
              village: Dago
              postal_code: '40135'
              address: Jl. Contoh No. 10
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateProfileMultipartRequest'
      responses:
        '200':
          description: Profil berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Profile]
      summary: Perbarui profil dengan foto profil
      description: Gunakan multipart/form-data untuk memperbarui field profil dan mengunggah foto profil. Endpoint ini setara dengan PATCH /profile untuk mendukung parser multipart Laravel.
      operationId: updateProfileWithAvatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateProfileMultipartRequest'
      responses:
        '200':
          description: Profil berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /orders:
    post:
      tags: [Orders]
      summary: Buat pesanan baru
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreateRequest' }
      responses:
        '201':
          description: Pesanan berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Order' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /cart:
    get:
      tags: [Cart]
      summary: Ambil isi keranjang pengguna
      operationId: getCart
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Isi keranjang
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Cart]
      summary: Tambahkan produk ke keranjang
      operationId: addCartItem
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemRequest' }
      responses:
        '201':
          description: Produk ditambahkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartItemResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Cart]
      summary: Kosongkan keranjang
      operationId: clearCart
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Keranjang dikosongkan }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /cart/{cartItem}:
    patch:
      tags: [Cart]
      summary: Perbarui jumlah item keranjang
      operationId: updateCartItem
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cartItem
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, maximum: 99 }
      responses:
        '200':
          description: Jumlah diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartItemResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Item tidak ditemukan }
    delete:
      tags: [Cart]
      summary: Hapus item dari keranjang
      operationId: removeCartItem
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cartItem
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Item dihapus }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Item tidak ditemukan }
  /social-media:
    get:
      tags: [Social Media]
      summary: Daftar link sosial media publik
      responses:
        '200': { description: Daftar link sosial media }
  /contact:
    post:
      tags: [Social Media]
      summary: Kirim pesan pusat bantuan ke email toko
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: string, format: email }
                message: { type: string, maxLength: 2000 }
      responses:
        '200': { description: Pesan berhasil dikirim }
  /admin/social-media:
    post:
      tags: [Social Media]
      summary: Tambah link sosial media (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocialMediaRequest' }
      responses:
        '201': { description: Link berhasil ditambahkan }
  /admin/social-media/{socialMedia}:
    patch:
      tags: [Social Media]
      summary: Perbarui link sosial media (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: socialMedia, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocialMediaRequest' }
      responses:
        '200': { description: Link berhasil diperbarui }
    delete:
      tags: [Social Media]
      summary: Hapus link sosial media (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: socialMedia, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Link berhasil dihapus }
  /admin/orders:
    get:
      tags: [Orders]
      summary: Daftar pesanan untuk admin
      operationId: listAdminOrders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar pesanan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Order' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /checkout/payment:
    post:
      tags: [Orders]
      summary: Buat order dan Snap token Midtrans
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutPaymentRequest' }
      responses:
        '201':
          description: Snap token berhasil dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutPaymentResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502': { description: Gagal membuat transaksi Midtrans }
  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Ambil status pembayaran order
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Status order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderStatusResponse' }
        '404': { description: Order tidak ditemukan }
  /webhooks/midtrans:
    post:
      tags: [Orders]
      summary: Notification webhook Midtrans
      description: Validasi signature dan update status order secara idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MidtransNotification' }
      responses:
        '200': { description: Notification berhasil diproses }
        '403': { description: Signature tidak valid }
  /products:
    get:
      tags: [Products]
      summary: Ambil semua produk
      operationId: listProducts
      parameters:
        - name: category
          in: query
          required: false
          schema: { type: string, enum: [Slide, Slop, Wedges] }
          description: Filter kategori produk.
          example: Slide
      responses:
        '200':
          description: Daftar produk
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
    post:
      tags: [Products]
      summary: Tambah produk
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ProductRequest' }
            example:
              slug: invoker-full-black
              name: Invoker Full Black
              category: Slide
              target: Women
              color: Hitam, Putih
              availableColors: [Hitam, Putih]
              images: [invoker-front.jpg, invoker-side.jpg]
              description: Sandal slide Invoker dengan desain minimalis full black.
              price: Rp249.000
              features: [Hand Made Crafting, Crousel Embossed Logo]
              availableSizes: ['36', '37', '38', '39', '40']
              availability: Tersedia
      responses:
        '201':
          description: Produk berhasil dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /categories:
    get:
      tags: [Product Categories]
      summary: Ambil semua kategori produk
      operationId: listProductCategories
      responses:
        '200':
          description: Daftar kategori produk
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProductCategory' }
  /categories/{category}:
    get:
      tags: [Product Categories]
      summary: Ambil detail kategori produk
      operationId: getProductCategory
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Detail kategori produk
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductCategoryResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/categories:
    post:
      tags: [Product Categories]
      summary: Tambah kategori produk
      operationId: createProductCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ProductCategoryCreateRequest' }
            example:
              name: wedges
              example_products: Nerona, Flavia, Joane.
      responses:
        '201':
          description: Kategori produk berhasil dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductCategoryResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/categories/{category}:
    patch:
      tags: [Product Categories]
      summary: Perbarui kategori produk
      description: Kirim sebagai POST dengan field `_method=PATCH` bila client tidak dapat mengirim file multipart menggunakan metode PATCH.
      operationId: updateProductCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ProductCategoryUpdateRequest' }
      responses:
        '200':
          description: Kategori produk berhasil diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductCategoryResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Product Categories]
      summary: Hapus kategori produk
      operationId: deleteProductCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200': { description: Kategori produk berhasil dihapus }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/category/{category}:
    get:
      tags: [Products]
      summary: Ambil produk berdasarkan kategori
      operationId: listProductsByCategory
      parameters:
        - name: category
          in: path
          required: true
          schema: { type: string, enum: [Slide, Slop, Wedges] }
          example: Slide
      responses:
        '200':
          description: Daftar produk dalam kategori
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
  /products/{product}:
    get:
      tags: [Products]
      summary: Ambil detail produk berdasarkan ID
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Detail produk
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Products]
      summary: Perbarui produk berdasarkan ID
      description: Gunakan `multipart/form-data` untuk field produk dan file gambar. Jika client tidak dapat mengirim file dengan metode PATCH, kirim POST ke URL yang sama dengan field `_method=PATCH`.
      operationId: updateProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ProductUpdateRequest' }
      responses:
        '200':
          description: Produk berhasil diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Products]
      summary: Hapus produk berdasarkan ID
      operationId: deleteProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Produk berhasil dihapus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
              example: { message: Produk berhasil dihapus. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users:
    get:
      tags: [Customers]
      summary: Ambil semua customer
      operationId: listCustomers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /users/{user}:
    get:
      tags: [Customers]
      summary: Ambil detail customer
      operationId: getCustomer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Detail customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Customers]
      summary: Perbarui customer
      operationId: updateCustomer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Customer berhasil diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Customers]
      summary: Hapus customer
      operationId: deleteCustomer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Customer berhasil dihapus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/auth/logout:
    post:
      tags: [Admin Authentication]
      summary: Logout administrator
      operationId: adminLogout
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Logout berhasil }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /admin/account:
    get:
      tags: [Admin Authentication]
      summary: Ambil detail akun admin
      operationId: getAdminAccount
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Detail akun admin }
    put:
      tags: [Admin Authentication]
      summary: Perbarui detail akun admin
      operationId: updateAdminAccount
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAccountUpdate' }
      responses:
        '200': { description: Akun diperbarui }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/account/password:
    put:
      tags: [Admin Authentication]
      summary: Ubah password admin
      operationId: updateAdminPassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPasswordUpdate' }
      responses:
        '200': { description: Password berhasil diubah }
        '422': { $ref: '#/components/responses/ValidationError' }
  /settings:
    get:
      tags: [Settings]
      summary: Ambil seluruh pengaturan toko
      operationId: getSettings
      responses:
        '200':
          description: Pengaturan profil, pengiriman, pembayaran, dan notifikasi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsResponse' }
  /settings/profile:
    put:
      tags: [Settings]
      summary: Simpan profil toko
      operationId: updateStoreProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreProfile' }
      responses:
        '200': { description: Profil tersimpan }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Settings]
      summary: Hapus profil toko
      operationId: deleteStoreProfile
      responses:
        '200': { description: Profil dihapus }
  /settings/shipping:
    get:
      tags: [Settings]
      summary: Daftar metode pengiriman dummy RajaOngkir
      operationId: getShippingMethods
      responses:
        '200': { description: Daftar metode pengiriman }
  /settings/shipping/{shippingMethod}:
    patch:
      tags: [Settings]
      summary: Aktif/nonaktifkan metode pengiriman
      operationId: toggleShippingMethod
      parameters:
        - { name: shippingMethod, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToggleRequest' }
      responses:
        '200': { description: Metode diperbarui }
  /settings/payments:
    get:
      tags: [Settings]
      summary: Daftar metode pembayaran dummy Midtrans
      operationId: getPaymentMethods
      responses:
        '200': { description: Daftar metode pembayaran }
  /settings/payments/{paymentMethod}:
    patch:
      tags: [Settings]
      summary: Aktif/nonaktifkan metode pembayaran
      operationId: togglePaymentMethod
      parameters:
        - { name: paymentMethod, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToggleRequest' }
      responses:
        '200': { description: Metode diperbarui }
  /settings/notifications:
    get:
      tags: [Settings]
      summary: Ambil preferensi notifikasi
      operationId: getNotificationSettings
      responses:
        '200': { description: Preferensi notifikasi }
    put:
      tags: [Settings]
      summary: Simpan preferensi notifikasi
      operationId: updateNotificationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationSettings' }
      responses:
        '200': { description: Preferensi diperbarui }
  /notifications:
    get:
      tags: [Notifications]
      summary: Histori notifikasi admin
      operationId: getNotifications
      responses:
        '200': { description: Histori notifikasi dan jumlah belum dibaca }
  /notifications/events:
    post:
      tags: [Notifications]
      summary: Catat event notifikasi pelanggan/pesanan
      operationId: createNotificationEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, title, message]
              properties:
                type: { type: string, enum: [new_customer, new_order] }
                title: { type: string }
                message: { type: string }
      responses:
        '200': { description: Event diproses sesuai preferensi notifikasi }
  /notifications/{notification}/read:
    patch:
      tags: [Notifications]
      summary: Tandai notifikasi telah dibaca
      operationId: markNotificationRead
      parameters:
        - { name: notification, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Notifikasi diperbarui }
  /settings/customization:
    get:
      tags: [Settings]
      summary: Ambil kustomisasi tampilan toko
      description: Mengembalikan warna secondary yang dikonfigurasi admin. Default #fbbc03 jika belum diatur.
      operationId: getCustomization
      responses:
        '200':
          description: Data kustomisasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      secondary_color: { type: string, example: '#fbbc03' }
                      hero_image: { type: string, format: uri, nullable: true }
                      size_guide_image: { type: string, format: uri, nullable: true }
                      about_image: { type: string, format: uri, nullable: true }
                      story_images: { type: array, minItems: 5, maxItems: 5, items: { type: string, format: uri, nullable: true } }
  /admin/customization:
    put:
      tags: [Settings]
      summary: Simpan kustomisasi tampilan toko
      description: Menyimpan warna secondary untuk diterapkan di frontend. Harus format hex 6 digit (contoh #ff5500).
      operationId: updateCustomization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secondary_color]
              properties:
                secondary_color: { type: string, pattern: '^#[0-9a-fA-F]{6}$', example: '#ff5500' }
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomizationUploadRequest'
      responses:
        '200':
          description: Kustomisasi berhasil disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Kustomisasi berhasil disimpan. }
                  data:
                    type: object
                    properties:
                      secondary_color: { type: string, example: '#ff5500' }
                      hero_image: { type: string, format: uri, nullable: true }
                      size_guide_image: { type: string, format: uri, nullable: true }
                      about_image: { type: string, format: uri, nullable: true }
                      story_images: { type: array, minItems: 5, maxItems: 5, items: { type: string, format: uri, nullable: true } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Settings]
      summary: Simpan kustomisasi beserta gambar
      description: Upload gambar hero, panduan ukuran, tentang kami, dan tepat lima gambar cerita menggunakan multipart/form-data.
      operationId: uploadCustomizationImages
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/CustomizationUploadRequest' }
      responses:
        '200': { description: Kustomisasi berhasil disimpan }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Gunakan token dari endpoint register/login sebagai `Bearer <token>`.
  parameters:
    ProductId:
      name: product
      in: path
      required: true
      description: ID produk
      schema: { type: integer, format: int64, example: 1 }
    CategoryId:
      name: category
      in: path
      required: true
      description: ID kategori produk
      schema: { type: integer, format: int64, example: 1 }
    UserId:
      name: user
      in: path
      required: true
      description: ID customer
      schema: { type: integer, format: int64, example: 1 }
  schemas:
    User:
      type: object
      required: [id, name, email, whatsapp, birth_date, gender, province, regency, district, village, postal_code, address, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, maxLength: 100, example: Budi Santoso }
        email: { type: string, format: email, example: budi@example.com }
        whatsapp: { type: string, description: 'Nomor disimpan dalam format internasional tanpa tanda plus', pattern: '^62[0-9]{8,13}$', example: '6281234567890' }
        birth_date: { type: string, format: date, nullable: true, example: '1995-08-17' }
        gender: { type: string, enum: [male, female, other], nullable: true, example: male }
        province: { type: string, nullable: true, example: Jawa Barat }
        province_id: { type: integer, nullable: true, example: 9 }
        regency: { type: string, nullable: true, example: Kota Bandung }
        regency_id: { type: integer, nullable: true, example: 108 }
        district: { type: string, nullable: true, example: Coblong }
        district_id: { type: integer, nullable: true, example: 1543 }
        village: { type: string, nullable: true, example: Dago }
        village_id: { type: integer, nullable: true, example: 22550 }
        postal_code: { type: string, nullable: true, example: '40135' }
        address: { type: string, nullable: true, example: Jl. Contoh No. 10 }
        avatar_url: { type: string, format: uri, nullable: true, readOnly: true, description: URL publik foto profil }
        created_at: { type: string, format: date-time, example: '2026-09-05T13:00:00.000000Z' }
        updated_at: { type: string, format: date-time, example: '2026-09-05T13:00:00.000000Z' }
    Customer:
      allOf:
        - $ref: '#/components/schemas/User'
    CustomerResponse:
      type: object
      required: [data]
      properties:
        message: { type: string }
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/Customer' }
    RegisterRequest:
      type: object
      required: [name, email, whatsapp, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, example: budi@example.com }
        whatsapp: { type: string, description: 'Menerima 08..., 8..., 62..., atau +62...; disimpan sebagai 62...', example: '081234567890' }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: budi@example.com }
        password: { type: string, format: password }
    UpdateProfileRequest:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, example: budi@example.com }
        whatsapp: { type: string, example: '081234567890' }
        birth_date: { type: string, format: date, nullable: true }
        gender: { type: string, enum: [male, female, other], nullable: true }
        province: { type: string, maxLength: 100, nullable: true }
        province_id: { type: integer, minimum: 1, nullable: true }
        regency: { type: string, maxLength: 100, nullable: true }
        regency_id: { type: integer, minimum: 1, nullable: true }
        district: { type: string, maxLength: 100, nullable: true }
        district_id: { type: integer, minimum: 1, nullable: true }
        village: { type: string, maxLength: 100, nullable: true }
        village_id: { type: integer, minimum: 1, nullable: true }
        postal_code: { type: string, maxLength: 10, nullable: true }
        address: { type: string, maxLength: 500, nullable: true }
    UpdateProfileMultipartRequest:
      type: object
      description: Field profil opsional. Gunakan multipart/form-data saat mengunggah foto profil.
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, example: budi@example.com }
        whatsapp: { type: string, example: '081234567890' }
        birth_date: { type: string, format: date, nullable: true }
        gender: { type: string, enum: [male, female, other], nullable: true }
        province: { type: string, maxLength: 100, nullable: true }
        province_id: { type: integer, minimum: 1, nullable: true }
        regency: { type: string, maxLength: 100, nullable: true }
        regency_id: { type: integer, minimum: 1, nullable: true }
        district: { type: string, maxLength: 100, nullable: true }
        district_id: { type: integer, minimum: 1, nullable: true }
        village: { type: string, maxLength: 100, nullable: true }
        village_id: { type: integer, minimum: 1, nullable: true }
        postal_code: { type: string, maxLength: 10, nullable: true }
        address: { type: string, maxLength: 500, nullable: true }
        avatar: { type: string, format: binary, description: 'Foto profil JPEG, PNG, WebP, atau GIF maksimal 5 MB' }
    CustomizationUploadRequest:
      type: object
      properties:
        secondary_color: { type: string, pattern: '^#[0-9a-fA-F]{6}$', example: '#ff5500' }
        hero_image: { type: string, format: binary, description: 'Gambar hero maksimal 5 MB' }
        size_guide_image: { type: string, format: binary, description: 'Gambar panduan ukuran maksimal 5 MB' }
        about_image: { type: string, format: binary, description: 'Gambar tentang kami maksimal 5 MB' }
        story_images:
          type: array
          minItems: 5
          maxItems: 5
          items: { type: string, format: binary, description: 'Gambar cerita maksimal 5 MB per file' }
    AuthResponse:
      type: object
      required: [message, data]
      properties:
        message: { type: string }
        data:
          type: object
          required: [user, token, token_type]
          properties:
            user: { $ref: '#/components/schemas/User' }
            token: { type: string, example: 1|example-token }
            token_type: { type: string, example: Bearer }
    ProfileResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/User' }
    StoreProfile:
      type: object
      required: [store_name, store_email, whatsapp, province, regency, district, village, postal_code, address]
      properties:
        store_name: { type: string, maxLength: 150 }
        store_email: { type: string, format: email }
        whatsapp: { type: string, maxLength: 20 }
        province: { type: string }
        regency: { type: string }
        district: { type: string }
        village: { type: string }
        postal_code: { type: string }
        address: { type: string }
        location_landmark: { type: string, nullable: true }
    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    AdminAccount:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        username: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, format: email }
        role: { type: string, example: admin }
        is_active: { type: boolean }
    AdminAccountUpdate:
      type: object
      required: [name, username, email]
      properties:
        name: { type: string }
        username: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, format: email }
    AdminPasswordUpdate:
      type: object
      properties:
        password: { type: string, format: password, minLength: 8, nullable: true, description: Kosongkan untuk mempertahankan password saat ini }
    ShippingMethod:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: jne }
        name: { type: string, example: JNE }
        provider: { type: string, example: RajaOngkir }
        is_active: { type: boolean }
    PaymentMethod:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: qris }
        name: { type: string, example: QRIS }
        type: { type: string, example: qris }
        is_active: { type: boolean }
    NotificationSettings:
      type: object
      properties:
        new_customer: { type: boolean }
        new_order: { type: boolean }
    ToggleRequest:
      type: object
      required: [is_active]
      properties:
        is_active: { type: boolean }
    SettingsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            profile: { $ref: '#/components/schemas/StoreProfile' }
            shipping: { type: array, items: { $ref: '#/components/schemas/ShippingMethod' } }
            payments: { type: array, items: { $ref: '#/components/schemas/PaymentMethod' } }
            notifications: { $ref: '#/components/schemas/NotificationSettings' }
    Product:
      type: object
      required: [id, slug, name, category, target, color, availableColors, images, description, price, weight, features, availableSizes, availability, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, example: 1 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', example: invoker-full-black }
        name: { type: string, example: Invoker Full Black }
        category: { type: string, enum: [Slide, Slop, Wedges], example: Slide }
        target: { type: string, enum: [Women, Men, Unisex, Kids], example: Women }
        color: { type: string, description: 'Satu atau beberapa warna dipisahkan koma', example: 'Hitam, Putih' }
        availableColors: { type: array, items: { type: string }, description: 'Subset warna dari field color yang tersedia untuk dipilih pembeli', example: [Hitam, Putih] }
        images: { type: array, items: { type: string, format: uri }, description: 'URL publik gambar yang dikembalikan API.', example: [http://localhost:8000/storage/products/invoker-front.jpg] }
        description: { type: string, example: Sandal slide Invoker dengan desain minimalis full black. }
        price: { type: string, example: Rp249.000 }
        weight: { type: integer, minimum: 1, description: 'Berat produk dalam gram.', example: 500 }
        features: { type: array, items: { type: string }, example: [Hand Made Crafting, Crousel Embossed Logo] }
        availableSizes: { type: array, items: { type: string }, example: ['36', '37', '38', '39', '40'] }
        availability: { type: string, enum: [Tersedia, Pre-order, Habis], example: Tersedia }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProductCategory:
      type: object
      required: [id, name, example_products, image, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, enum: [unisex, kids, women, men, wedges, slop, slides], example: wedges }
        example_products: { type: string, maxLength: 2000, example: 'Nerona, Flavia, Joane.' }
        image: { type: string, format: uri, nullable: true, description: URL publik gambar kategori }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProductCategoryCreateRequest:
      type: object
      required: [name, example_products, image]
      properties:
        name: { type: string, enum: [unisex, kids, women, men, wedges, slop, slides] }
        example_products: { type: string, maxLength: 2000 }
        image: { type: string, format: binary, nullable: true, description: Satu file gambar kategori, maksimal 5 MB }
    ProductCategoryUpdateRequest:
      type: object
      description: Setidaknya satu field harus dikirim.
      properties:
        name: { type: string, enum: [unisex, kids, women, men, wedges, slop, slides] }
        example_products: { type: string, maxLength: 2000 }
        image: { type: string, format: binary, nullable: true, description: Ganti dengan satu file gambar baru, maksimal 5 MB }
    ProductCategoryResponse:
      type: object
      required: [data]
      properties:
        message: { type: string }
        data:
          type: object
          required: [category]
          properties:
            category: { $ref: '#/components/schemas/ProductCategory' }
    ProductRequest:
      allOf:
        - $ref: '#/components/schemas/ProductCreateFields'
    ProductUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ProductUpdateFields'
    OrderProduct:
      type: object
      required: [name, weight, quantity, total_weight]
      properties:
        name: { type: string, maxLength: 200, example: Luna Sandal }
        size: { type: string, nullable: true, example: '40' }
        color: { type: string, nullable: true, example: Jet Black }
        weight: { type: integer, minimum: 1, description: 'Berat satu produk dalam gram.', example: 500 }
        quantity: { type: integer, minimum: 1, example: 2 }
        total_weight: { type: integer, minimum: 1, description: 'Berat produk dikalikan jumlah.', example: 1000 }
    OrderCreateRequest:
      type: object
      required: [customer_name, products, item_count, payment_method, total]
      properties:
        customer_name: { type: string, maxLength: 150 }
        products: { type: array, minItems: 1, items: { $ref: '#/components/schemas/OrderProduct' } }
        item_count: { type: integer, minimum: 1 }
        payment_method: { type: string, maxLength: 150 }
        total: { type: integer, minimum: 0 }
    CheckoutPaymentRequest:
      type: object
      required: [items, shipping, idempotency_key]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, size, color, quantity]
            properties:
              product_id: { type: integer }
              size: { type: string }
              color: { type: string }
              quantity: { type: integer, minimum: 1 }
        shipping:
          type: object
          required: [courier, service, cost]
          properties:
            courier: { type: string }
            service: { type: string }
            cost: { type: integer, minimum: 0 }
        idempotency_key: { type: string, maxLength: 100 }
    CartItemRequest:
      type: object
      required: [product_id, size, color]
      properties:
        product_id: { type: integer, format: int64 }
        size: { type: string, maxLength: 50 }
        color: { type: string, maxLength: 100 }
        quantity: { type: integer, minimum: 1, maximum: 99, default: 1 }
    CartItem:
      type: object
      required: [id, product_id, product, size, color, quantity]
      properties:
        id: { type: integer, format: int64 }
        product_id: { type: integer, format: int64 }
        product: { $ref: '#/components/schemas/Product' }
        size: { type: string }
        color: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 99 }
    CartResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
    CartItemResponse:
      type: object
      required: [message, data]
      properties:
        message: { type: string }
        data: { $ref: '#/components/schemas/CartItem' }
    SocialMediaRequest:
      type: object
      required: [platform, account_name, url]
      properties:
        platform: { type: string, maxLength: 50, example: Instagram }
        account_name: { type: string, maxLength: 150, example: '@crousel.official' }
        url: { type: string, format: uri, maxLength: 500 }
    SocialMediaLink:
      allOf:
        - $ref: '#/components/schemas/SocialMediaRequest'
        - type: object
          properties:
            id: { type: integer }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    CheckoutPaymentResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            order_id: { type: string }
            snap_token: { type: string }
    OrderStatusResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Order' }
    MidtransNotification:
      type: object
      required: [order_id, status_code, gross_amount, signature_key, transaction_status]
      properties:
        order_id: { type: string }
        status_code: { type: string }
        gross_amount: { type: string }
        signature_key: { type: string }
        transaction_status: { type: string }
        transaction_id: { type: string }
        payment_type: { type: string }
        settlement_time: { type: string, format: date-time }
    Order:
      type: object
      properties:
        id: { type: string, example: CRS-260911-0001 }
        customer: { type: string }
        date: { type: string, example: 11/09/2026 }
        products: { type: array, items: { $ref: '#/components/schemas/OrderProduct' } }
        items: { type: integer }
        payment: { type: string }
        total: { type: integer }
        status: { type: string }
        payment_status: { type: string, enum: [pending, paid, failed, expired, cancelled] }
        transaction_status: { type: string, nullable: true }
        gross_amount: { type: integer }
        midtrans_transaction_id: { type: string, nullable: true }
        snap_token: { type: string, nullable: true, writeOnly: true }
        shipping_cost: { type: integer }
        paid_at: { type: string, format: date-time, nullable: true }
    ProductCreateFields:
      type: object
      required: [slug, name, category, target, color, availableColors, images, description, price, weight, features, availableSizes, availability]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        name: { type: string, maxLength: 150 }
        category: { type: string, enum: [Slide, Slop, Wedges] }
        target: { type: string, enum: [Women, Men, Unisex, Kids] }
        color: { type: string, maxLength: 255, description: 'Satu atau beberapa warna dipisahkan koma' }
        availableColors: { type: array, minItems: 1, items: { type: string } }
        images: { type: array, minItems: 1, items: { type: string, format: binary }, description: 'Satu atau beberapa file gambar (JPEG, PNG, WebP, atau GIF), maksimal 5 MB per file.' }
        description: { type: string }
        price: { type: string, maxLength: 50 }
        weight: { type: integer, minimum: 1, description: 'Berat produk dalam gram.' }
        features: { type: array, items: { type: string } }
        availableSizes: { type: array, minItems: 1, items: { type: string } }
        availability: { type: string, enum: [Tersedia, Pre-order, Habis] }
    ProductUpdateFields:
      type: object
      description: Semua field opsional; hanya field yang dikirim akan diperbarui.
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        name: { type: string, maxLength: 150 }
        category: { type: string, enum: [Slide, Slop, Wedges] }
        target: { type: string, enum: [Women, Men, Unisex, Kids] }
        color: { type: string, maxLength: 255 }
        availableColors: { type: array, items: { type: string } }
        images: { type: array, items: { type: string, format: binary }, description: 'Opsional. Jika dikirim, gambar baru akan ditambahkan (append) ke daftar gambar saat ini. Maksimal 5 MB per file.' }
        deletedImages: { type: array, items: { type: string, format: uri }, description: 'Daftar URL gambar yang sudah ada (dari respons API) untuk dihapus dari produk ini.' }
        description: { type: string }
        price: { type: string, maxLength: 50 }
        weight: { type: integer, minimum: 1, description: 'Berat produk dalam gram.' }
        features: { type: array, items: { type: string } }
        availableSizes: { type: array, items: { type: string } }
        availability: { type: string, enum: [Tersedia, Pre-order, Habis] }
    ProductResponse:
      type: object
      required: [data]
      properties:
        message: { type: string }
        data:
          type: object
          properties:
            product: { $ref: '#/components/schemas/Product' }
    MessageResponse:
      type: object
      properties:
        message: { type: string }
    ValidationError:
      type: object
      properties:
        message: { type: string, example: The given data was invalid. }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          example:
            whatsapp: [The whatsapp has already been taken.]
    UnauthenticatedError:
      type: object
      properties:
        message: { type: string, example: Unauthenticated. }
  responses:
    ValidationError:
      description: Data tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    Unauthenticated:
      description: Token tidak ada atau tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UnauthenticatedError' }
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: 'No query results for model [App\\Models\\Product] 99.' }
