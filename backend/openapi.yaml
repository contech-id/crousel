openapi: 3.0.3
info:
  title: Crousel Ecommerce API
  description: API autentikasi dan profil pengguna untuk aplikasi ecommerce.
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
tags:
  - name: Authentication
    description: Registrasi, login, dan logout pengguna
  - name: Profile
    description: Data profil pengguna yang sedang login
  - name: Products
    description: Katalog produk ecommerce
  - name: Customers
    description: Data customer yang terdaftar
paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Registrasi akun baru
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Budi Santoso
              whatsapp: '081234567890'
              password: rahasia123
      responses:
        '201':
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                message: Registrasi berhasil.
                data:
                  user:
                    id: 1
                    name: Budi Santoso
                    whatsapp: '6281234567890'
                    birth_date: null
                    gender: null
                    province: null
                    regency: null
                    district: null
                    village: null
                    postal_code: null
                    address: null
                    created_at: '2026-09-05T13:00:00.000000Z'
                    updated_at: '2026-09-05T13:00:00.000000Z'
                  token: 1|example-token
                  token_type: Bearer
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/login:
    post:
      tags: [Authentication]
      summary: Login dengan nomor WhatsApp
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              whatsapp: '+6281234567890'
              password: rahasia123
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout dan cabut token aktif
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Logout berhasil.
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /profile:
    get:
      tags: [Profile]
      summary: Ambil profil pengguna yang sedang login
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags: [Profile]
      summary: Perbarui profil pengguna
      description: Semua field bersifat opsional; hanya field yang dikirim yang diperbarui. Kirim null untuk mengosongkan field profil.
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              name: Budi Santoso
              whatsapp: '081234567890'
              birth_date: '1995-08-17'
              gender: male
              province: Jawa Barat
              regency: Kota Bandung
              district: Coblong
              village: Dago
              postal_code: '40135'
              address: Jl. Contoh No. 10
      responses:
        '200':
          description: Profil berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /products:
    get:
      tags: [Products]
      summary: Ambil semua produk
      operationId: listProducts
      parameters:
        - name: category
          in: query
          required: false
          schema: { type: string }
          description: Filter kategori (alternatif dari endpoint `/products/category/{category}`).
          example: Sandal Slide Women
      responses:
        '200':
          description: Daftar produk
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
    post:
      tags: [Products]
      summary: Tambah produk
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ProductRequest' }
            example:
              slug: luna-sandal
              name: Luna Sandal
              category: Sandal Slide Women
              target: Women
              model: Luna Classic Slide
              color: Sand Beige
              availableColors: [Sand Beige, Jet Black, Cloud White]
              images: [luna-front.jpg, luna-side.jpg]
              shortDescription: Slide ringan dengan siluet minimal.
              description: Luna menghadirkan langkah santai yang tetap terlihat rapi.
              price: Rp249.000
              material: Upper kulit sintetis premium, footbed EVA, outsole karet anti-slip.
              features: [Hand Made Crafting, Crousel Embossed Logo]
              availableSizes: ['36', '37', '38', '39', '40']
              sandalLength: 24,5-26 cm
              footLengthRecommendation: 23-25,5 cm
              width: 9,5 cm
              wedgeHeight: null
              packagingWeight: ±650 g
              availability: Tersedia
      responses:
        '201':
          description: Produk berhasil dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /products/category/{category}:
    get:
      tags: [Products]
      summary: Ambil produk berdasarkan kategori
      operationId: listProductsByCategory
      parameters:
        - name: category
          in: path
          required: true
          schema: { type: string }
          example: Sandal Slide Women
      responses:
        '200':
          description: Daftar produk dalam kategori
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
  /products/{product}:
    get:
      tags: [Products]
      summary: Ambil detail produk berdasarkan ID
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Detail produk
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Products]
      summary: Perbarui produk berdasarkan ID
      description: Gunakan `multipart/form-data` untuk field produk dan file gambar. Jika client tidak dapat mengirim file dengan metode PATCH, kirim POST ke URL yang sama dengan field `_method=PATCH`.
      operationId: updateProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ProductUpdateRequest' }
      responses:
        '200':
          description: Produk berhasil diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Products]
      summary: Hapus produk berdasarkan ID
      operationId: deleteProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Produk berhasil dihapus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
              example: { message: Produk berhasil dihapus. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users:
    get:
      tags: [Customers]
      summary: Ambil semua customer
      operationId: listCustomers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /users/{user}:
    get:
      tags: [Customers]
      summary: Ambil detail customer
      operationId: getCustomer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Detail customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Customers]
      summary: Perbarui customer
      operationId: updateCustomer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Customer berhasil diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Customers]
      summary: Hapus customer
      operationId: deleteCustomer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Customer berhasil dihapus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Gunakan token dari endpoint register/login sebagai `Bearer <token>`.
  parameters:
    ProductId:
      name: product
      in: path
      required: true
      description: ID produk
      schema: { type: integer, format: int64, example: 1 }
    UserId:
      name: user
      in: path
      required: true
      description: ID customer
      schema: { type: integer, format: int64, example: 1 }
  schemas:
    User:
      type: object
      required: [id, name, whatsapp, birth_date, gender, province, regency, district, village, postal_code, address, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, maxLength: 100, example: Budi Santoso }
        whatsapp: { type: string, description: 'Nomor disimpan dalam format internasional tanpa tanda plus', pattern: '^62[0-9]{8,13}$', example: '6281234567890' }
        birth_date: { type: string, format: date, nullable: true, example: '1995-08-17' }
        gender: { type: string, enum: [male, female, other], nullable: true, example: male }
        province: { type: string, nullable: true, example: Jawa Barat }
        regency: { type: string, nullable: true, example: Kota Bandung }
        district: { type: string, nullable: true, example: Coblong }
        village: { type: string, nullable: true, example: Dago }
        postal_code: { type: string, nullable: true, example: '40135' }
        address: { type: string, nullable: true, example: Jl. Contoh No. 10 }
        created_at: { type: string, format: date-time, example: '2026-09-05T13:00:00.000000Z' }
        updated_at: { type: string, format: date-time, example: '2026-09-05T13:00:00.000000Z' }
    Customer:
      allOf:
        - $ref: '#/components/schemas/User'
    CustomerResponse:
      type: object
      required: [data]
      properties:
        message: { type: string }
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/Customer' }
    RegisterRequest:
      type: object
      required: [name, whatsapp, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        whatsapp: { type: string, description: 'Menerima 08..., 8..., 62..., atau +62...; disimpan sebagai 62...', example: '081234567890' }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }
    LoginRequest:
      type: object
      required: [whatsapp, password]
      properties:
        whatsapp: { type: string, example: '081234567890' }
        password: { type: string, format: password }
    UpdateProfileRequest:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        whatsapp: { type: string, example: '081234567890' }
        birth_date: { type: string, format: date, nullable: true }
        gender: { type: string, enum: [male, female, other], nullable: true }
        province: { type: string, maxLength: 100, nullable: true }
        regency: { type: string, maxLength: 100, nullable: true }
        district: { type: string, maxLength: 100, nullable: true }
        village: { type: string, maxLength: 100, nullable: true }
        postal_code: { type: string, maxLength: 10, nullable: true }
        address: { type: string, maxLength: 500, nullable: true }
    AuthResponse:
      type: object
      required: [message, data]
      properties:
        message: { type: string }
        data:
          type: object
          required: [user, token, token_type]
          properties:
            user: { $ref: '#/components/schemas/User' }
            token: { type: string, example: 1|example-token }
            token_type: { type: string, example: Bearer }
    ProfileResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/User' }
    Product:
      type: object
      required: [id, slug, name, category, target, model, color, availableColors, images, shortDescription, description, price, material, features, availableSizes, sandalLength, footLengthRecommendation, availability, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, example: 1 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', example: luna-sandal }
        name: { type: string, example: Luna Sandal }
        category: { type: string, example: Sandal Slide Women }
        target: { type: string, enum: [Women, Men, Unisex, Kids], example: Women }
        model: { type: string, example: Luna Classic Slide }
        color: { type: string, example: Sand Beige }
        availableColors: { type: array, items: { type: string }, example: [Sand Beige, Jet Black, Cloud White] }
        images: { type: array, items: { type: string, format: uri }, description: 'URL publik gambar yang dikembalikan API.', example: [http://localhost:8000/storage/products/luna-front.jpg] }
        shortDescription: { type: string, example: Slide ringan dengan siluet minimal untuk hari yang aktif. }
        description: { type: string, example: Luna menghadirkan langkah santai yang tetap terlihat rapi. }
        price: { type: string, example: Rp249.000 }
        material: { type: string, example: 'Upper kulit sintetis premium, footbed EVA, outsole karet anti-slip.' }
        features: { type: array, items: { type: string }, example: [Hand Made Crafting, Crousel Embossed Logo] }
        availableSizes: { type: array, items: { type: string }, example: ['36', '37', '38', '39', '40'] }
        sandalLength: { type: string, example: '24,5-26 cm' }
        footLengthRecommendation: { type: string, example: '23-25,5 cm' }
        width: { type: string, nullable: true, example: '9,5 cm' }
        wedgeHeight: { type: string, nullable: true, example: 5 cm }
        packagingWeight: { type: string, nullable: true, example: ±650 g }
        availability: { type: string, enum: [Tersedia, Pre-order, Habis], example: Tersedia }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProductRequest:
      allOf:
        - $ref: '#/components/schemas/ProductCreateFields'
    ProductUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ProductUpdateFields'
    ProductCreateFields:
      type: object
      required: [slug, name, category, target, model, color, availableColors, images, shortDescription, description, price, material, features, availableSizes, sandalLength, footLengthRecommendation, availability]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        name: { type: string, maxLength: 150 }
        category: { type: string, maxLength: 100 }
        target: { type: string, enum: [Women, Men, Unisex, Kids] }
        model: { type: string, maxLength: 150 }
        color: { type: string, maxLength: 100 }
        availableColors: { type: array, minItems: 1, items: { type: string } }
        images: { type: array, minItems: 1, items: { type: string, format: binary }, description: 'Satu atau beberapa file gambar (JPEG, PNG, WebP, atau GIF), maksimal 5 MB per file.' }
        shortDescription: { type: string, maxLength: 1000 }
        description: { type: string }
        price: { type: string, maxLength: 50 }
        material: { type: string, maxLength: 1000 }
        features: { type: array, items: { type: string } }
        availableSizes: { type: array, minItems: 1, items: { type: string } }
        sandalLength: { type: string, maxLength: 100 }
        footLengthRecommendation: { type: string, maxLength: 100 }
        width: { type: string, nullable: true, maxLength: 100 }
        wedgeHeight: { type: string, nullable: true, maxLength: 100 }
        packagingWeight: { type: string, nullable: true, maxLength: 100 }
        availability: { type: string, enum: [Tersedia, Pre-order, Habis] }
    ProductUpdateFields:
      type: object
      description: Semua field opsional; hanya field yang dikirim akan diperbarui.
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        name: { type: string, maxLength: 150 }
        category: { type: string, maxLength: 100 }
        target: { type: string, enum: [Women, Men, Unisex, Kids] }
        model: { type: string, maxLength: 150 }
        color: { type: string, maxLength: 100 }
        availableColors: { type: array, items: { type: string } }
        images: { type: array, items: { type: string, format: binary }, description: 'Opsional. Jika dikirim, seluruh gambar produk akan diganti dengan file baru (maksimal 5 MB per file).' }
        shortDescription: { type: string, maxLength: 1000 }
        description: { type: string }
        price: { type: string, maxLength: 50 }
        material: { type: string, maxLength: 1000 }
        features: { type: array, items: { type: string } }
        availableSizes: { type: array, items: { type: string } }
        sandalLength: { type: string, maxLength: 100 }
        footLengthRecommendation: { type: string, maxLength: 100 }
        width: { type: string, nullable: true, maxLength: 100 }
        wedgeHeight: { type: string, nullable: true, maxLength: 100 }
        packagingWeight: { type: string, nullable: true, maxLength: 100 }
        availability: { type: string, enum: [Tersedia, Pre-order, Habis] }
    ProductResponse:
      type: object
      required: [data]
      properties:
        message: { type: string }
        data:
          type: object
          properties:
            product: { $ref: '#/components/schemas/Product' }
    MessageResponse:
      type: object
      properties:
        message: { type: string }
    ValidationError:
      type: object
      properties:
        message: { type: string, example: The given data was invalid. }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          example:
            whatsapp: [The whatsapp has already been taken.]
    UnauthenticatedError:
      type: object
      properties:
        message: { type: string, example: Unauthenticated. }
  responses:
    ValidationError:
      description: Data tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    Unauthenticated:
      description: Token tidak ada atau tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UnauthenticatedError' }
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: 'No query results for model [App\\Models\\Product] 99.' }
